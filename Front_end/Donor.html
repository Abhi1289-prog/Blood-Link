<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: url('file:///c:/Saro_Abhi Project/Front end/background.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5em;
            color: #e74c3c; 
        }

        form {
            background-color: rgba(0, 0, 0, 0.7); 
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex; /* Use flexbox for layout */
            flex-direction: column; /* Arrange buttons in a column */
            align-items: center; /* Center items horizontally */
            max-width: 400px; /* Set a maximum width for the form */
            margin: auto; /* Center the form in the viewport */
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 15px; 
            margin: 15px 0; /* Space between buttons */
            font-size: 1.2em; 
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%; /* Full width buttons */
            height: 60px; /* Fixed height for buttons */
            display: flex; 
            align-items: center;
            justify-content: center;
        }

        button img {
            width: 24px; 
            height: 24px; 
            margin-right: 10px;
        }

        button:hover {
            background-color: #c0392b; 
        }
    </style>
</head>
<body>
    <form>
        <h1>Welcome Donor</h1>
        <button type="button">
            <img src="c:/Saro&Abhi Project/Front end/OIp.jfif" alt="Find Blood Group"> Find Your Blood group
        </button>
        <button type="button">
            <img src="c:/Saro&Abhi Project/Front end/th.jfif" alt="Fill The Form"> Fill The Form
        </button>
        <button type="button">
            <img src="c:/Saro&Abhi Project/Front end/download.png" alt="Book a Slot"> Book a slot
        </button>
        <button type="button">
            <img src="c:/Saro&Abhi Project/Front end/download (1).png" alt="Feedback"> Feedback
        </button>
    </form>
</body>
</html>
